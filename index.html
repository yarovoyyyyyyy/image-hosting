    <!-- Подключаем стили Lightbox -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
    <style>
        body { background: #1a1a2e; font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #fff; text-align: center; margin-bottom: 30px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .gallery a {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .gallery a:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            background: #000; /* фон на случай прозрачности */
        }
        /* Стиль для подписей в Lightbox (по желанию) */
        .lb-data .lb-caption {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
